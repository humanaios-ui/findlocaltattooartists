<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poco Loco’s Local Tattoo Artists</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hero {
      background-image: linear-gradient(rgba(10,10,10,0.75), rgba(10,10,10,0.92)), 
                        url('https://picsum.photos/id/1015/2000/1400');
      background-size: cover;
      background-position: center 35%;
      background-attachment: fixed;
    }
    .headline {
      text-shadow: 0 6px 40px rgba(0,0,0,0.95);
      letter-spacing: -0.05em;
    }
  </style>
</head>
<body class="bg-black text-white">
  <div class="hero min-h-screen flex items-center justify-center relative">
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-black/50 to-black"></div>
    
    <div class="relative z-10 text-center px-6 max-w-4xl mx-auto">
      <h1 class="text-6xl md:text-[4.8rem] font-bold tracking-[-0.04em] headline text-[#9f1239] mb-6 leading-none">
        Poco Loco’s Local Tattoo Artists
      </h1>
      
      <p class="text-2xl md:text-3xl mb-12 text-white/90">
        Connect with Tattoo Artists & Shops Worldwide
      </p>

      <div class="max-w-xl mx-auto mb-14">
        <div class="flex flex-col sm:flex-row gap-4">
          <input 
            type="text" 
            id="search-input"
            placeholder="Search by city, zip code, or style (e.g. Black & Grey Realism)" 
            class="flex-1 px-8 py-7 text-lg bg-white/10 border border-white/30 rounded-3xl focus:outline-none focus:border-[#9f1239] placeholder:text-white/60">
          <button 
            onclick="performSearch()" 
            class="px-14 py-7 bg-[#9f1239] hover:bg-red-700 text-xl font-semibold rounded-3xl transition-all active:scale-95">
            Search Artists
          </button>
        </div>
      </div>

      <div class="flex justify-center gap-10 text-lg">
        <a href="#" class="hover:text-[#9f1239] transition-colors">Artist Login</a>
        <a href="#" class="hover:text-[#9f1239] transition-colors">Shop Login</a>
        <a href="#" class="hover:text-[#9f1239] transition-colors">Customer Login</a>
      </div>
    </div>
  </div>

  <script>
    function performSearch() {
      const q = document.getElementById('search-input').value.trim();
      alert(q ? `Demo Search: "${q}"\n\n(Full directory coming soon)` : "Demo is live!\nTry searching for a city or tattoo style.");
    }
  </script>
</body>
</html>
