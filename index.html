<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poco Loco’s Local Tattoo Artists</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .hero {
      background-image: linear-gradient(rgba(8, 8, 8, 0.75), rgba(8, 8, 8, 0.88)), 
                        url('assets/hero-gorilla-worldmap.jpg.PNG');
      background-size: cover;
      background-position: center 35%;
      background-attachment: fixed;
    }
    .headline {
      text-shadow: 0 8px 40px rgba(0, 0, 0, 0.95);
      letter-spacing: -0.06em;
    }
    .search-input {
      transition: all 0.3s ease;
    }
    .search-input:focus {
      box-shadow: 0 0 0 4px rgba(159, 18, 57, 0.4);
      border-color: #9f1239;
    }
    .btn-search {
      transition: all 0.2s ease;
    }
    .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(159, 18, 57, 0.3);
    }
  </style>
</head>
<body class="bg-black text-white overflow-x-hidden">
  <!-- Hero -->
  <div class="hero min-h-screen flex items-center justify-center relative">
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-black/40 to-black/90"></div>
    
    <div class="relative z-10 text-center px-6 max-w-5xl mx-auto">
      <h1 class="text-6xl md:text-7xl font-bold tracking-tighter headline text-[#9f1239] mb-6 leading-none">
        Poco Loco’s Local Tattoo Artists
      </h1>
      
      <p class="text-2xl md:text-3xl mb-12 text-white/90 max-w-3xl mx-auto font-light">
        Connect with Tattoo Artists & Shops Worldwide
      </p>

      <!-- Search -->
      <div class="max-w-2xl mx-auto mb-16">
        <div class="flex flex-col sm:flex-row gap-4 px-2">
          <input 
            type="text" 
            id="search-input"
            placeholder="Search by city, zip code, or style (e.g. Black & Grey Realism)" 
            class="search-input flex-1 px-8 py-7 text-lg bg-white/10 border border-white/40 rounded-3xl focus:outline-none placeholder:text-white/60 text-white">
          <button 
            onclick="performSearch()" 
            class="btn-search px-14 py-7 bg-[#9f1239] hover:bg-red-700 text-xl font-semibold rounded-3xl transition-all active:scale-95 whitespace-nowrap shadow-lg">
            Search Artists
          </button>
        </div>
      </div>

      <!-- Login Links -->
      <div class="flex flex-wrap justify-center gap-x-12 gap-y-6 text-lg font-medium">
        <a href="#" class="hover:text-[#9f1239] transition-colors flex items-center gap-2">
          <i class="fas fa-user"></i> Artist Login
        </a>
        <a href="#" class="hover:text-[#9f1239] transition-colors flex items-center gap-2">
          <i class="fas fa-store"></i> Shop Login
        </a>
        <a href="#" class="hover:text-[#9f1239] transition-colors flex items-center gap-2">
          <i class="fas fa-user-circle"></i> Customer Login
        </a>
      </div>
    </div>

    <!-- Scroll indicator -->
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 text-white/40 text-sm tracking-widest">
      SCROLL TO EXPLORE ↓
    </div>
  </div>

  <script>
    function performSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (query) {
        // TODO: Replace with real search once backend is ready
        window.location.href = `/search?q=${encodeURIComponent(query)}`;
      } else {
        alert("🔍 Please enter a city, zip, or style to search artists.");
      }
    }
  </script>
</body>
</html>
