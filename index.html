<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poco Loco’s Local Tattoo Artists</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hero {
      background-image: linear-gradient(rgba(20,20,20,0.75), rgba(20,20,20,0.85)), url('https://picsum.photos/id/1015/2000/1200');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .headline {
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body class="bg-black text-white overflow-x-hidden">
  <div class="hero min-h-screen flex items-center justify-center relative">
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-black/30 to-black/80"></div>
    
    <div class="relative z-10 text-center px-6 max-w-5xl mx-auto">
      <h1 class="text-6xl md:text-7xl font-bold tracking-tighter headline text-[#9f1239] mb-6">
        Poco Loco’s Local Tattoo Artists
      </h1>
      <p class="text-2xl md:text-3xl mb-12 text-white/90">
        Connect with Tattoo Artists & Shops Worldwide
      </p>

      <div class="max-w-2xl mx-auto mb-12">
        <div class="flex flex-col sm:flex-row gap-3">
          <input 
            type="text" 
            id="search-input"
            placeholder="Search by city, zip code, or style (e.g. Black & Grey Realism)" 
            class="flex-1 px-8 py-6 text-lg bg-white/10 border border-white/40 rounded-3xl focus:outline-none focus:border-[#9f1239] placeholder:text-white/50">
          <button 
            onclick="performSearch()" 
            class="px-12 py-6 bg-gradient-to-r from-[#9f1239] to-red-700 hover:from-red-700 hover:to-[#9f1239] rounded-3xl font-semibold text-xl transition-all active:scale-95">
            Search Artists
          </button>
        </div>
      </div>

      <div class="flex flex-wrap justify-center gap-x-10 gap-y-4 text-lg">
        <a href="#" class="hover:text-[#9f1239] transition">Artist Login</a>
        <a href="#" class="hover:text-[#9f1239] transition">Shop Login</a>
        <a href="#" class="hover:text-[#9f1239] transition">Customer Login</a>
      </div>
    </div>
  </div>

  <script>
    function performSearch() {
      const query = document.getElementById('search-input').value;
      if (query.trim()) {
        alert(`Search for "${query}" — Full search coming in next update!`);
      } else {
        alert("Demo: Search functionality active. Try typing a city or style.");
      }
    }
  </script>
</body>
</html>
