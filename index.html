<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poco Loco’s Local Tattoo Artists</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hero {
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)), url('https://picsum.photos/id/1015/2000/1200');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="bg-black text-white">
  <div class="hero min-h-screen flex items-center justify-center relative">
    <div class="text-center z-10 px-6 max-w-4xl">
      <h1 class="text-6xl md:text-7xl font-bold text-[#9f1239] tracking-tighter mb-6">Poco Loco’s Local Tattoo Artists</h1>
      <p class="text-2xl md:text-3xl mb-12">Connect with Tattoo Artists & Shops Worldwide</p>
      
      <div class="max-w-2xl mx-auto mb-10">
        <div class="flex flex-col sm:flex-row gap-4">
          <input 
            type="text" 
            placeholder="Search by city, zip code, or style (e.g. Black & Grey Realism)" 
            class="flex-1 px-6 py-5 text-lg bg-white/10 border border-white/30 rounded-2xl focus:outline-none focus:border-red-600">
          <button onclick="alert('Search functionality coming soon! Demo homepage is live.')" 
            class="px-10 py-5 bg-gradient-to-r from-[#9f1239] to-orange-600 rounded-2xl font-semibold text-lg hover:scale-105 transition">
            Search Artists
          </button>
        </div>
      </div>

      <div class="flex flex-wrap justify-center gap-8 text-xl">
        <a href="#" class="hover:text-[#9f1239] transition">Artist Login</a>
        <a href="#" class="hover:text-[#9f1239] transition">Shop Login</a>
        <a href="#" class="hover:text-[#9f1239] transition">Customer Login</a>
      </div>
    </div>
  </div>
</body>
</html>
